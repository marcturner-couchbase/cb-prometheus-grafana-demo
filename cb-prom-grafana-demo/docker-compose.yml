services:
  couchbase:
    image: couchbase:enterprise-7.6.4
    container_name: cb-demo
    ports:
      - "18191-18196:8091-8096"
      - "11211:11210"
    volumes:
      - cb-data:/opt/couchbase/var

  prometheus:
    image: prom/prometheus:latest
    container_name: prom-demo
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - couchbase

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-demo
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

  loadgen:
    image: python:3.11-slim
    container_name: avis-loadgen
    profiles: ["loadgen"]
    working_dir: /app
    volumes:
      - ./loadgen:/app
    environment:
      - CB_CONN_STR=couchbase://couchbase
      - CB_USERNAME=Administrator
      - CB_PASSWORD=password123
      - CB_BUCKET=avis-fleet
      - FLEET_SIZE=500
      - TARGET_OPS=200
      - THREADS=8
      - DURATION_SECONDS=0
      - SEED_ONLY=0
    command: sh -c "pip install --quiet -r requirements.txt && python avis_loadgen.py"
    depends_on:
      - couchbase

volumes:
  cb-data:
